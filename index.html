<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Commutator manufacturing</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9ecef;--bg2:#f4f6f8;--card:rgba(255,255,255,.82);--ink:#0e151c;--mut:#556270;--line:#d5dbe1;--muted:#edf0f3;--acc:#a8561f;--accg:linear-gradient(135deg,#c4733a,#9c4c19);--accfg:#fff;--acct:#9a4a17;--accsoft:rgba(196,115,58,.13);--ring:#c4733a;--ok:#0b7a64;--okbg:rgba(16,160,128,.13);--bad:#c02b2b;--badbg:rgba(220,60,60,.11);--warn:#8a5a00;--warnbg:rgba(230,160,30,.17);--scrim:rgba(14,21,28,.55);--sh:0 1px 2px rgba(14,21,28,.06),0 8px 24px -12px rgba(14,21,28,.18);--edge:linear-gradient(135deg,rgba(196,115,58,.55),rgba(14,21,28,.06) 38%,rgba(14,21,28,.06));--grid:rgba(14,21,28,.045);--glow:rgba(196,115,58,.16);--r:16px;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#080d13;--bg2:#0c131b;--card:rgba(20,29,40,.72);--ink:#e8edf3;--mut:#8d9bad;--line:rgba(160,185,210,.14);--muted:rgba(150,175,200,.07);--acc:#e08a4a;--accg:linear-gradient(135deg,#f0a063,#cf6d2c);--accfg:#1b0e05;--acct:#f2a468;--accsoft:rgba(224,138,74,.14);--ring:#f2a468;--ok:#4fe0bd;--okbg:rgba(79,224,189,.12);--bad:#ff7a7a;--badbg:rgba(255,122,122,.12);--warn:#ffc15e;--warnbg:rgba(255,193,94,.12);--scrim:rgba(2,5,9,.75);--sh:0 0 0 1px rgba(160,185,210,.05) inset,0 18px 40px -22px rgba(0,0,0,.8);--edge:linear-gradient(135deg,rgba(240,160,99,.55),rgba(160,185,210,.10) 35%,rgba(160,185,210,.06));--grid:rgba(160,185,210,.045);--glow:rgba(224,138,74,.14);color-scheme:dark}}
:root[data-theme=dark]{--bg:#080d13;--bg2:#0c131b;--card:rgba(20,29,40,.72);--ink:#e8edf3;--mut:#8d9bad;--line:rgba(160,185,210,.14);--muted:rgba(150,175,200,.07);--acc:#e08a4a;--accg:linear-gradient(135deg,#f0a063,#cf6d2c);--accfg:#1b0e05;--acct:#f2a468;--accsoft:rgba(224,138,74,.14);--ring:#f2a468;--ok:#4fe0bd;--okbg:rgba(79,224,189,.12);--bad:#ff7a7a;--badbg:rgba(255,122,122,.12);--warn:#ffc15e;--warnbg:rgba(255,193,94,.12);--scrim:rgba(2,5,9,.75);--sh:0 0 0 1px rgba(160,185,210,.05) inset,0 18px 40px -22px rgba(0,0,0,.8);--edge:linear-gradient(135deg,rgba(240,160,99,.55),rgba(160,185,210,.10) 35%,rgba(160,185,210,.06));--grid:rgba(160,185,210,.045);--glow:rgba(224,138,74,.14);color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:clip}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:14.5px/1.55 'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums;display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh;background:radial-gradient(900px 420px at 18% -8%,var(--glow),transparent 70%),linear-gradient(var(--grid) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(180deg,var(--bg2),var(--bg));background-attachment:fixed}
/* sidebar */
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--card);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);border-right:1px solid var(--line);padding:max(22px,env(safe-area-inset-top)) 14px 20px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.logo{width:40px;height:40px;flex:none;filter:drop-shadow(0 0 10px var(--glow))}
.logo .seg{animation:spin 1.6s cubic-bezier(.2,.7,.2,1) both;transform-origin:16px 16px}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes spin{from{transform:rotate(-200deg);opacity:0}to{transform:rotate(0);opacity:1}}
h1{font-size:14.5px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.01em}
.biz{display:flex;flex-direction:column;gap:6px;padding:0 6px}
.biz>label{font-size:12px;font-weight:500;color:var(--mut)}
.biz select{width:100%}
.bm{font-size:13px;color:var(--mut)}
.bm summary{cursor:pointer;padding:6px 0;font-weight:500;border-radius:6px}
.bm summary:hover{color:var(--ink)}
.bmb{display:flex;flex-direction:column;gap:8px;padding:6px 0 2px}
.bmb input,.bmb button{width:100%}
#rs{display:flex;flex-direction:column;gap:8px}
#nav{display:flex;flex-direction:column;gap:3px}
#nav button{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;color:var(--mut);padding:9px 12px;border-radius:10px;font:inherit;font-weight:500;font-size:13.5px;cursor:pointer;min-height:42px;transition:background .18s,color .18s}
#nav button:hover{background:var(--muted);color:var(--ink)}
#nav button.on{background:linear-gradient(90deg,var(--accsoft),transparent);color:var(--ink);font-weight:600}
#nav button.on::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accg);box-shadow:0 0 12px var(--ring)}
#nav button.on svg{color:var(--acct)}
#nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* main */
.main{padding:34px clamp(16px,3vw,44px) max(48px,env(safe-area-inset-bottom));min-width:0;max-width:1220px;width:100%}
.ph{margin-bottom:24px}
.ph h2{font-size:28px;line-height:1.2;margin:0;font-weight:600;letter-spacing:-.025em}
.ph p{margin:6px 0 0;color:var(--mut);max-width:62ch;font-size:14px}
h2{font-size:15.5px;margin:0 0 16px;font-weight:600;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 8px}
p{max-width:75ch}
.card{position:relative;background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid transparent;border-radius:var(--r);padding:22px;margin-bottom:18px;box-shadow:var(--sh);background-clip:padding-box}
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--edge);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
/* forms */
input,select{font:inherit;font-size:14px;color:var(--ink);background:var(--muted);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-height:40px;min-width:0;transition:border-color .18s,box-shadow .18s,background .18s}
select option{background:#fff;color:#0e151c}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;min-height:40px;text-align:left;line-height:1.3;overflow:hidden}
input[type=date]::-webkit-date-and-time-value,input[type=month]::-webkit-date-and-time-value{text-align:left;min-height:1.3em;margin:0;padding:0}
input[type=date]::-webkit-calendar-picker-indicator{margin:0 0 0 4px}
input,select{max-width:100%}
input:hover,select:hover{border-color:var(--mut)}
input::placeholder{color:var(--mut);opacity:.6}
input:focus-visible,select:focus-visible{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px var(--accsoft)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.row>label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:500;color:var(--mut);flex:1 1 150px}
.row>label input,.row>label select{width:100%;color:var(--ink)}
button.b{font:inherit;font-size:13.5px;font-weight:600;background:var(--accg);color:var(--accfg);border:1px solid transparent;border-radius:10px;padding:8px 18px;min-height:40px;cursor:pointer;box-shadow:0 6px 18px -8px var(--ring);transition:filter .18s,box-shadow .18s,transform .12s,background .18s,border-color .18s}
button.b:hover{filter:brightness(1.1);box-shadow:0 8px 22px -6px var(--ring)}
button.b:active{filter:brightness(.94);transform:translateY(1px)}
button.b.g{background:var(--muted);color:var(--ink);border-color:var(--line);box-shadow:none;font-weight:500}
button.b.g:hover{background:var(--accsoft);border-color:var(--ring);filter:none;box-shadow:none}
.tabs{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--muted);border:1px solid var(--line);padding:4px;border-radius:12px;margin-bottom:16px}
.tabs button.b{background:transparent;border-color:transparent;color:var(--mut);min-height:34px;box-shadow:none;font-weight:500}
.tabs button.b.g:hover{background:var(--accsoft);color:var(--ink);border-color:transparent}
.tabs button.b:not(.g){background:var(--accg);color:var(--accfg);box-shadow:0 4px 14px -6px var(--ring);font-weight:600}
.swl{flex:none;flex-direction:row;align-items:center;margin:0 0 0 auto}.sw{display:flex;align-items:center;gap:10px;min-height:38px;cursor:pointer;position:relative}.sw input{position:absolute;opacity:0;width:46px;height:26px;margin:0;cursor:pointer}.sw .tr{width:46px;height:26px;border-radius:13px;background:var(--muted);border:1px solid var(--line);position:relative;flex:none;transition:background .2s,box-shadow .2s}.sw .tr:after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--mut);transition:transform .2s,background .2s}.sw input:checked+.tr{background:var(--accsoft);border-color:var(--ring);box-shadow:0 0 14px -2px var(--ring)}.sw input:checked+.tr:after{transform:translateX(20px);background:var(--accg)}.sw input:focus-visible+.tr{outline:2px solid var(--ring);outline-offset:2px}.sw span:last-child{font-size:12.5px;color:var(--mut)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr:last-child>td,tr:last-child>th{border-bottom:0}
table tr:first-child>th{color:var(--mut);font-weight:500;font-size:12px;background:transparent;border-bottom-color:var(--ring)}
table tr:not(:first-child)>th{background:var(--accsoft);color:var(--ink);font-weight:600}
tr:hover>td{background:var(--accsoft)}
td.n,th.n,.kpis b{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;letter-spacing:-.02em}
.n{text-align:right}
td input,td select{min-height:30px;padding:4px 9px;font-size:13px}
td button.b{min-height:28px;padding:2px 10px;font-size:12px}
td:last-child:has(button){white-space:normal;min-width:140px}td:last-child:has(.act){white-space:nowrap;min-width:0}
.act{display:inline-flex;gap:2px;vertical-align:middle}.ib{display:inline-grid;place-items:center;width:28px;height:28px;padding:0;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--mut);cursor:pointer;transition:background .15s,color .15s,border-color .15s}.ib:hover{background:var(--accsoft);color:var(--acct);border-color:var(--line)}.ib.dl:hover{background:rgba(220,60,60,.12);color:var(--bad)}.ib:focus-visible{outline:2px solid var(--acc);outline-offset:1px}td:last-child>button.b{margin:2px 4px 2px 0}
.inf{display:inline-grid;place-items:center;width:22px;height:22px;margin-left:6px;padding:0;vertical-align:middle;border:0;border-radius:50%;background:transparent;color:var(--mut);cursor:help;transition:color .15s,background .15s}.inf:hover,.inf:focus-visible{color:var(--acct);background:var(--accsoft)}.inf:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#tip,#cht{position:fixed;z-index:90;display:none;pointer-events:none;background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 13px;font-size:13px;line-height:1.45;font-weight:400;letter-spacing:0;text-transform:none;box-shadow:0 18px 44px -14px rgba(0,0,0,.55),0 0 0 1px var(--accsoft);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
th .inf{margin-left:0}
td.tr{max-width:170px;overflow:hidden;text-overflow:ellipsis}
td[colspan]:only-child{color:var(--mut);text-align:center;padding:30px 14px;white-space:normal}
/* status */
.alert{border:1px solid var(--warn);border-left-width:3px;background:var(--warnbg);color:var(--warn);padding:12px 16px;border-radius:12px;margin-bottom:16px;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:7px;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600;background:var(--muted)}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.pill.paid{background:var(--okbg)}.pill.unpaid{background:var(--badbg)}.pill.part{background:var(--warnbg)}
.paid{color:var(--ok)}.unpaid{color:var(--bad)}.part{color:var(--warn)}

/* charts */
:root{--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--c1:#3987e5;--c2:#d95926;--c3:#199e70}}
:root[data-theme=dark]{--c1:#3987e5;--c2:#d95926;--c3:#199e70}
.chbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:16px}
.chbar .tabs{margin-bottom:0}
.chg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.chc{background:var(--muted);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;min-width:0}
.chc h3{margin:0 0 2px;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.chc .sub{margin:0 0 10px;color:var(--mut);font-size:12.5px}
.chc svg{display:block;width:100%;height:auto;overflow:visible}
.chc svg text{font-family:inherit;font-size:11px;fill:var(--mut)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mut);margin:0 0 6px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(70px,32%) 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.hb .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.hb .t{height:12px;background:var(--line);border-radius:6px;overflow:hidden;opacity:.9}
.hb .t b{display:block;height:100%;border-radius:6px;min-width:3px}
.hb .v{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:var(--ink);text-align:right}
.chc .none{color:var(--mut);font-size:13px;padding:18px 0;text-align:center}
.chc table{font-size:12.5px}
[data-ct]{cursor:default}
@media(max-width:600px){.chc{padding:14px 12px 10px}.hb{grid-template-columns:minmax(84px,34%) 1fr auto}.hb .l{white-space:normal;line-height:1.25;font-size:12.5px}}
.tabs{max-width:100%}
@media(max-width:700px){.tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button.b{flex:none;white-space:nowrap}}

.paper{background:#fff;color:#111;border-radius:8px;padding:20px 18px;font-size:12.5px;box-shadow:0 2px 14px rgba(0,0,0,.28)}
.paper .ph1{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:15px}.paper .ph1 span{font-size:11px;color:#556}
.paper .ph2{margin-top:8px;font-size:12px;color:#445}.paper .ph3{font-size:16px;font-weight:700;margin-top:2px}.paper .ph4{font-size:12px;color:#445;margin:4px 0 12px}
.paper table{width:100%;border-collapse:collapse;border-spacing:0;background:none;border:0}
.paper th{background:#eef1f4!important;color:#111!important;text-align:left;font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid #cfd6dd}
.paper td{color:#111!important;padding:6px 8px;border-bottom:1px solid #e6eaee;vertical-align:top;background:none!important}
.paper .n{text-align:right;font-family:'JetBrains Mono',ui-monospace,monospace;white-space:nowrap;font-size:12px}
.paper tr.ob td{background:#f6f8fa!important}
#lst td:nth-child(2){white-space:normal;overflow-wrap:anywhere;min-width:180px}
.paper td:nth-child(2),.paper td.lr{white-space:normal;overflow-wrap:anywhere}.paper td:nth-child(2){min-width:180px}
@media(max-width:600px){.paper{padding:12px 6px}#ov .card:has(.paper){padding:12px 10px}.paper .lr{display:none}.paper table{zoom:.8}.paper td:nth-child(2){white-space:normal;overflow-wrap:anywhere;min-width:70px;max-width:120px}.paper .ph1,.paper .ph2,.paper .ph3,.paper .ph4{padding:0 4px}.paper th,.paper td{padding:5px 3px;font-size:11.5px}.paper .n{font-size:11px;letter-spacing:-.02em}.paper .ph1{font-size:14px}.paper .ph3{font-size:15px}}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.kpis div{position:relative;overflow:hidden;background:var(--card);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--sh);min-width:0}
.kpis div::after{content:'';position:absolute;left:18px;right:18px;top:0;height:2px;border-radius:0 0 2px 2px;background:var(--accg);box-shadow:0 0 14px var(--ring)}
.kpis small{color:var(--mut);display:block;font-size:12.5px}
.pins{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pin{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--muted);min-width:0}
.pin.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--ring)}
.pin b{display:block;font-size:16px;overflow-wrap:anywhere}
.pin .bl{margin:6px 0 8px;font-weight:600}
.pin small{display:block;color:var(--mut);margin-bottom:8px}
.pin .pr{display:flex;gap:8px;flex-wrap:wrap}
.pb{background:none;border:0;cursor:pointer;font-size:18px;line-height:1;padding:4px 6px;color:var(--mut)}
.pb.on{color:var(--warn)}
.kpis b{display:block;margin-top:6px;font-weight:600;font-size:22px;line-height:1.2;letter-spacing:-.04em;overflow-wrap:anywhere}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--muted);align-self:flex-start}
.sync::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--mut);flex:none}
.sync.live::before{background:var(--ok);box-shadow:0 0 8px var(--ok)}.sync.saving::before,.sync.connecting::before{background:var(--warn);box-shadow:0 0 8px var(--warn)}.sync.err::before,.sync.full::before,.sync.ro::before{background:var(--bad);box-shadow:0 0 8px var(--bad)}
#toast{display:none;position:fixed;right:20px;bottom:20px;z-index:60;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--ring);border-radius:12px;padding:10px 14px;box-shadow:0 12px 32px -12px rgba(0,0,0,.6);font-size:13px;max-width:calc(100vw - 40px)}
.ro #m button.b:not(.g),.ro #m input,.ro #m select,.ro .bm{pointer-events:none;opacity:.55}
.pk{position:relative;display:inline-block;min-width:0;max-width:100%;vertical-align:middle}
label>.pk,.biz>.pk{display:block;width:100%}
.pk>select,.pk>input{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none}
.pkb{font:inherit;font-size:14px;color:var(--ink);background:var(--muted);border:1px solid var(--line);border-radius:10px;padding:8px 34px 8px 11px;min-height:40px;width:100%;text-align:left;cursor:pointer;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:border-color .18s,box-shadow .18s,background .18s}
.pkb:hover{border-color:var(--mut)}
.pkb:focus-visible,.pkb[aria-expanded=true]{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px var(--accsoft)}
.pkb.empty{color:var(--mut)}
.pkb:disabled{opacity:.55;cursor:not-allowed}

/* ======== Stock, costing and invoice maths ======== */
const sell = b => b.items.filter(i => i.type != 'raw');
const itm = (b, id) => b.items.find(i => i.id == id) || { name: '?', cost: 0, gst: 18, hsn: '', unit: '' };
const eff = (b, f) => {
  const o = { ...(f.bom || {}) };
  if (f.cu) o[f.cu.item] = f.cu.grams / 1000 / ((itm(b, f.cu.item).yield || 100) / 100);
  return o;
};
const cur = (b, i) => {
  const p = b.pur.filter(x => x.item == i.id);
  return p.length ? p[p.length - 1].rate : i.cost;
};
const ip = (b, i) => (i.from ? Math.max(cur(b, itm(b, i.from)) - i.less, 0) : i.price);
const cst = (b, i) =>
  i.type == 'fg' ? Object.entries(eff(b, i)).reduce((s, [k, q]) => s + q * cur(b, itm(b, k)), 0) : cur(b, i);
const stock = (b, i) =>
  fq(
    i.open +
      b.pur.filter(p => p.item == i.id).reduce((s, p) => s + p.qty, 0) +
      b.prod.filter(p => p.fg == i.id).reduce((s, p) => s + p.qty, 0) +
      b.prod.filter(p => p.scrap && p.scrap.item == i.id).reduce((s, p) => s + p.scrap.qty, 0) +
      b.prod.reduce(
        (s, p) => s + (p.byp || []).filter(x => x.item == i.id).reduce((a, x) => a + x.qty, 0),
        0
      ) +
      b.sr.reduce(
        (s, r) =>
          s + (r.stock === false ? 0 : r.lines.filter(l => l.item == i.id).reduce((a, l) => a + l.qty, 0)),
        0
      ) -
      b.prr.filter(r => r.item == i.id).reduce((s, r) => s + r.qty, 0) -
      b.rej.filter(r => r.fg == i.id).reduce((s, r) => s + r.qty, 0) -
      b.inv.reduce((s, v) => s + v.lines.filter(l => l.item == i.id).reduce((a, l) => a + l.qty, 0), 0) -
      b.prod.reduce((s, p) => s + p.use.filter(u => u.item == i.id).reduce((a, u) => a + u.qty, 0), 0)
  );
const raws = b => b.items.filter(i => i.type == 'raw'),
  fgs = b => b.items.filter(i => i.type == 'fg');
function tot(b, v) {
  let t = 0,
    x = 0;
  const r = v.co === false ? 0 : 0.18;
  v.lines.forEach(l => {
    const a = l.qty * l.rate;
    t += a;
    x += a * r;
  });
  return { t, x, g: t + x };
}
const srNet = (b, v) =>
    b.sr.filter(r => r.inv == v.id).reduce((s, r) => s + r.lines.reduce((a, l) => a + l.qty * l.rate, 0), 0),
  srGross = (b, v) => srNet(b, v) * (v.co === false ? 1 : 1.18),
  srQty = (b, v, item) =>
    b.sr
      .filter(r => r.inv == v.id)
      .reduce((s, r) => s + r.lines.filter(l => l.item == item).reduce((a, l) => a + l.qty, 0), 0);
const prQty = (b, p) => b.prr.filter(r => r.pur == p.id).reduce((s, r) => s + r.qty, 0);
const paid = (b, v) => b.tx.filter(t => t.inv == v.id).reduce((s, t) => s + t.amt, 0) + srGross(b, v);
const bal = (b, k) => k.open + b.tx.filter(t => t.bank == k.id).reduce((s, t) => s + t.amt, 0);
const cashAcc = b => ({ id: 'cash', name: 'Cash in hand', open: b.cashOpen || 0 }),
  gpayAcc = b => ({ id: 'gpay', name: 'GPay', open: b.gpayOpen || 0 }),
  /* Individuals are paid in cash or GPay; firms and companies only through a bank account. */
  isPer = id => id == 'cash' || id == 'gpay',
  PER_OPTS = '<option value="cash">Cash in hand</option><option value="gpay">GPay</option>',
  mname = id => (id == 'gpay' ? 'GPay' : 'cash'),
  accOpts = b =>
    b.banks.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('') + PER_OPTS;

/* An account (bank, cash or GPay) never goes into credit: a payment is refused when the balance is short. */
const accOf = (b, id) => (id == 'cash' ? cashAcc(b) : id == 'gpay' ? gpayAcc(b) : b.banks.find(k => k.id == id));
function lowBal(b, id, amt) {
  const k = accOf(b, id);
  if (!k) return '';
  const have = bal(b, k);
  return amt > have + 0.005
    ? `Insufficient balance in ${k.name}: ${fmt(have)} available, ${fmt(amt)} needed. Pick another account, receive money first, or pay later.`
    : '';
}

  if (!kc)

  if (ed && (ed.co === false) != (kc.type == 'person'))
    return (e.textContent =
      'A GST invoice and a no-GST bill cannot be switched. Pick a customer of the same kind, or delete this one and create a new one.');
  if (!L.length) return (e.textContent = 'Add at least one product with a quantity.');
  const need = {};
  for (const r of L) need[r.item] = (need[r.item] || 0) + r.qty;
  for (const k in need) {
    const i = itm(b, k),
      own = ed ? ed.lines.filter(l => l.item == k).reduce((s, l) => s + l.qty, 0) : 0;
    if (need[k] > stock(b, i) + own)
      return (e.textContent = `Only ${fq(stock(b, i) + own)} ${i.name} in stock. Record production first.`);
  }
  const lines = L.map(r => ({ item: r.item, qty: r.qty, rate: +r.rate || ip(b, itm(b, r.item)) }));
  if (lines.some(l => !(l.rate > 0)))

  const co = D.ct != 'person';
  if (ed) {

      ...ed,
      cu: D.cu.trim(),
      dt: D.dt || today(),
      ty: co ? D.ty : 'none',
      lr: D.lr.trim(),
      lrd: D.lrd,
      tr: D.tr.trim(),
      lines
    };
    tryMut(
      b => {
        const pd = b.tx.filter(t => t.inv == ed.id).reduce((s, t) => s + t.amt, 0) + srGross(b, nv),
          nt = tot(b, nv).g;
        if (nt < pd - 0.005)
          return `The new total (${fmt(nt)}) is less than the ${fmt(pd)} already paid or credited. Remove or reduce those payments first.`;
        for (const l of ed.lines) {
          const rq = srQty(b, ed, l.item),
            nq = lines.filter(x => x.item == l.item).reduce((s, x) => s + x.qty, 0);

        }

      },
      m => (e.textContent = m),
      () => (D = D0())
    );

  }

function need(b, f, q) {

    .filter(([k, v]) => v > 0)
    .map(([k, v]) => ({ item: k, qty: fq(v * q) }));
}
function mkRun(b, f, q, dt) {
  const u = need(b, f, q);

  const sh = u.filter(x => x.qty > stock(b, itm(b, x.item)));
  if (sh.length)
    return (
      'Not enough: ' +
      sh.map(x => `${itm(b, x.item).name} (need ${x.qty}, have ${stock(b, itm(b, x.item))})`).join(', ')
    );
  let sc = null;
  if (f.cu) {
    const co = itm(b, f.cu.item),
      cq = (u.find(x => x.item == f.cu.item) || { qty: 0 }).qty;
    if (co.scrap) sc = { item: co.scrap, qty: fq(cq * (1 - (co.yield || 100) / 100)) };
  }
  b.prod.push({
    id: uid(),
    dt,
    fg: f.id,
    qty: q,
    use: u,
    scrap: sc,
    byp: Object.entries(f.byp || {}).map(([k, v]) => ({ item: k, qty: fq(v * q) }))
  });
  return '';
}

function doSR() {

    v = b.inv.find(x => x.id == $('#sri').value),
    e = $('#srerr');

  const seen = {},
    its = v.lines.filter(l => !seen[l.item] && (seen[l.item] = 1)),
    lines = [];
  for (let i = 0; i < its.length; i++) {
    const el = $('#srq' + i);
    if (!el) continue;
    const q = +el.value,
      l = its[i],
      rem = fq(v.lines.filter(x => x.item == l.item).reduce((a, x) => a + x.qty, 0) - srQty(b, v, l.item));
    if (!(q > 0)) continue;
    if (q > rem + 1e-9) return (e.textContent = `Only ${rem} ${itm(b, l.item).name} can be returned.`);
    lines.push({ item: l.item, qty: q, rate: l.rate });
  }
  if (!lines.length) return (e.textContent = 'Enter a quantity to return.');
  b.sr.push({
    id: uid(),
    no: 'CN-' + String(b.sr.length + 1).padStart(4, '0'),
    inv: v.id,
    dt: $('#srd').value || today(),
    note: $('#srn').value.trim(),

  R();
}
function doPR() {

/* ======== Reports ======== */
function calc(b) {
  let S_ = 0,
    go = 0,
    deb = 0;
  b.inv.forEach(v => {
    const t = tot(b, v),
      n = srNet(b, v);
    S_ += t.t - n;
    go += t.x - n * (v.co === false ? 0 : 0.18);
    deb += t.g - paid(b, v);
  });
  b.cust.forEach(c => (deb += partyDue(b, c, true)));
  const obS = b.sup.reduce((s, c) => s + partyDue(b, c, false), 0),
    obOpen = b.cust.reduce((s, c) => s + (c.open || 0), 0) - b.sup.reduce((s, c) => s + (c.open || 0), 0);
  const P = b.pur.reduce((s, p) => s + (p.qty - prQty(b, p)) * p.rate, 0),
    O = b.items.reduce((s, i) => s + i.open * (i.type == 'raw' ? i.cost : cst(b, i)), 0),
    Cl = b.items.reduce((s, i) => s + stock(b, i) * cst(b, i), 0),
    bank = b.banks.reduce((s, k) => s + bal(b, k), 0),
    cash = bal(b, cashAcc(b)),
    gpay = bal(b, gpayAcc(b));
  const E = b.exp.reduce((s, x) => s + x.amt, 0);
  return {
    cred: b.pur.reduce((s, p) => s + totP(p) - paidP(b, p), 0) + obS,
    cash,
    gpay,
    E,
    pr: S_ - (O + P - Cl) - E,
    sales: S_,
    go,
    gi:
      b.pur.reduce((s, p) => s + (p.qty - prQty(b, p)) * p.rate * pg(p), 0) +
      b.exp.reduce((s, x) => s + x.amt * (x.gst ? 0.18 : 0), 0),
    P,
    O,
    Cl,
    cogs: O + P - Cl,
    deb,
    bank,
    cap: O + b.banks.reduce((s, k) => s + k.open, 0) + (b.cashOpen || 0) + (b.gpayOpen || 0) + obOpen
  };
}

const CH = { rng: 6, tbl: false };
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const mlab = k => MON[+k.slice(5, 7) - 1] + " '" + k.slice(2, 4);
const fmtC = n => {
  const a = Math.abs(n),
    sg = n < 0 ? '-' : '';
  if (a >= 1e7) return sg + '₹' + +(a / 1e7).toFixed(2) + 'Cr';
  if (a >= 1e5) return sg + '₹' + +(a / 1e5).toFixed(2) + 'L';
  if (a >= 1e3) return sg + '₹' + +(a / 1e3).toFixed(1) + 'k';
  return sg + '₹' + Math.round(a);
};
function chMonths(b) {
  const ds = [...b.inv, ...b.pur, ...b.exp, ...b.prod, ...b.rej, ...b.sr, ...b.prr].map(x => (x.dt || '').slice(0, 7)).filter(Boolean),
    now = today().slice(0, 7);
  let first = ds.length ? ds.reduce((m, d) => (d < m ? d : m), ds[0]) : now;
  const n = CH.rng == 0 ? 0 : CH.rng,
    out = [];
  let y = +now.slice(0, 4),
    m = +now.slice(5, 7);
  const lim = n || 120;
  for (let i = 0; i < lim; i++) {
    const k = y + '-' + String(m).padStart(2, '0');
    if (!n && k < first) break;
    out.unshift(k);
    if (--m == 0) {
      m = 12;
      y--;
    }
  }
  return out;
}
function chData(b) {
  const ms = chMonths(b),
    ix = {};
  const rows = ms.map((k, i) => ((ix[k] = i), { k, sales: 0, pur: 0, exp: 0, prod: 0, rej: 0 }));
  const add = (d, f, v) => {
    const r = rows[ix[(d || '').slice(0, 7)]];
    if (r) r[f] += v;
  };
  b.inv.forEach(v => add(v.dt, 'sales', tot(b, v).t));
  b.sr.forEach(r => add(r.dt, 'sales', -r.lines.reduce((a, l) => a + l.qty * l.rate, 0)));
  b.pur.forEach(p => add(p.dt, 'pur', p.qty * p.rate));
  b.prr.forEach(r => {
    const p = b.pur.find(x => x.id == r.pur);
    if (p) add(r.dt, 'pur', -r.qty * p.rate);
  });
  b.exp.forEach(x => add(x.dt, 'exp', x.amt));
  b.prod.forEach(x => add(x.dt, 'prod', x.qty));
  b.rej.forEach(x => add(x.dt, 'rej', x.qty));
  rows.forEach(r => (r.net = r.sales - r.pur - r.exp));
  return rows;
}
function chNice(mx, mn) {
  const span = Math.max(mx - Math.min(mn, 0), 1),
    raw = span / 4,
    pw = Math.pow(10, Math.floor(Math.log10(raw))),
    st = [1, 2, 2.5, 5, 10].map(m => m * pw).find(v => v >= raw) || 10 * pw;
  return { st, lo: Math.floor(Math.min(mn, 0) / st) * st, hi: Math.ceil(Math.max(mx, 0) / st) * st || st };
}
const chW = () => (innerWidth < 700 ? 340 : 600);
const topR = (x, y, w, h, r) => {
  r = Math.min(r, w / 2, h);
  return h <= 0
    ? ''
    : `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
};
function chBars(rows, ser, fmtV) {
  const W = chW(),
    H = 220,
    L = 46,
    R = 6,
    T = 8,
    B = 26,
    pw = W - L - R,
    ph = H - T - B;
  const mx = Math.max(0, ...rows.flatMap(r => ser.map(x => r[x.k]))),
    nz = chNice(mx, 0),
    sc = v => T + ph - ((v - nz.lo) / (nz.hi - nz.lo)) * ph;
  let g = '';
  for (let v = nz.lo; v <= nz.hi + 1e-9; v += nz.st)
    g += `<line x1="${L}" x2="${W - R}" y1="${sc(v)}" y2="${sc(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${sc(v) + 4}" text-anchor="end">${fmtV(v)}</text>`;
  const gw = pw / rows.length,
    inner = gw * 0.72,
    bw = Math.max(3, Math.min(26, (inner - (ser.length - 1) * 2) / ser.length));
  const tw = bw * ser.length + (ser.length - 1) * 2;
  const every = Math.ceil(rows.length / Math.max(2, Math.floor(pw / 46)));
  rows.forEach((r, i) => {
    const cx = L + gw * i + gw / 2;
    if (i % every == 0 || i == rows.length - 1) g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${mlab(r.k)}</text>`;
    const tipTxt = `<b>${mlab(r.k)}</b>` + ser.map(x => `<br><span style="color:${x.c}">■</span> ${x.n}: ${fmtV(r[x.k], 1)}`).join('');
    ser.forEach((x, j) => {
      const h = sc(0) - sc(r[x.k]),
        bx = cx - tw / 2 + j * (bw + 2);
      g += `<path class="bar" style="--k:${i}" d="${topR(bx, sc(r[x.k]), bw, Math.max(h, r[x.k] > 0 ? 2 : 0), 4)}" fill="${x.c}"/>`;
    });
    g += `<rect x="${cx - gw / 2}" y="${T}" width="${gw}" height="${ph}" fill="transparent" data-ct="${esc(tipTxt)}"/>`;
  });
  g += `<line x1="${L}" x2="${W - R}" y1="${sc(0)}" y2="${sc(0)}" stroke="var(--mut)" stroke-width="1" opacity=".5"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function chLine(rows, key, c, name) {
  const W = chW(),
    H = 200,
    L = 52,
    R = 10,
    T = 10,
    B = 34,
    pw = W - L - R,
    ph = H - T - B;
  const vals = rows.map(r => r[key]),
    nz = chNice(Math.max(...vals), Math.min(...vals)),
    sc = v => T + ph - ((v - nz.lo) / (nz.hi - nz.lo)) * ph,
    xs = i => L + (rows.length == 1 ? pw / 2 : (pw * i) / (rows.length - 1));
  let g = '';
  for (let v = nz.lo; v <= nz.hi + 1e-9; v += nz.st)
    g += `<line x1="${L}" x2="${W - R}" y1="${sc(v)}" y2="${sc(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${sc(v) + 4}" text-anchor="end">${fmtC(v)}</text>`;
  g += `<line x1="${L}" x2="${W - R}" y1="${sc(0)}" y2="${sc(0)}" stroke="var(--mut)" opacity=".55"/>`;
  g += `<path d="${rows.map((r, i) => (i ? 'L' : 'M') + xs(i) + ',' + sc(r[key])).join('')}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" class="ln" pathLength="1"/>`;
  const every = Math.ceil(rows.length / Math.max(2, Math.floor(pw / 46)));
  rows.forEach((r, i) => {
    if (i % every == 0 || i == rows.length - 1) g += `<text x="${xs(i)}" y="${H - 6}" text-anchor="middle">${mlab(r.k)}</text>`;
    g += `<circle class="dt" style="--k:${i}" cx="${xs(i)}" cy="${sc(r[key])}" r="4" fill="${c}" stroke="var(--bg2)" stroke-width="2"/>`;

}

(function () {
  let el = null;
  const tip = () => {
    let q = $('#cht');
    if (!q) {
      q = document.createElement('div');
      q.id = 'cht';
      q.setAttribute('role', 'tooltip');
      document.body.appendChild(q);
    }
    return q;
  };
  const hide = () => {
    el = null;
    if ($('#cht')) $('#cht').style.display = 'none';
  };
  const show = t => {
    if (!t || !t.getAttribute) return hide();
    const x = t.closest && t.closest('[data-ct]');
    if (!x) return hide();
    const q = tip();
    q.innerHTML = x.getAttribute('data-ct');
    q.style.display = 'block';
    const r = x.getBoundingClientRect(),
      w = q.offsetWidth,
      h = q.offsetHeight;
    let l = r.left + r.width / 2 - w / 2,
      tp = r.top - h - 8;
    if (tp < 6) tp = r.bottom + 8;
    l = Math.max(6, Math.min(l, innerWidth - w - 6));
    q.style.left = l + 'px';
    q.style.top = tp + 'px';
    el = x;
  };
  document.addEventListener('mouseover', e => {
    if (e.target.closest && e.target.closest('[data-ct]')) show(e.target);
    else if (el) hide();
  });
  document.addEventListener('click', e => {
    if (e.target.closest && e.target.closest('[data-ct]')) show(e.target);
    else if (el) hide();
  });
  document.addEventListener('scroll', () => el && hide(), true);
})();

    b.pur.filter(p => nk(p.sup) == k).reduce((s, p) => s + totP(p) - paidP(b, p), 0) -

    P.y = P.H - P.M;
  };
  P.t = (x, y, t, sz, b, al) => {
    t = pdfT(t);
    if (al == 'r') x -= tw(t, sz, b);
    else if (al == 'c') x -= tw(t, sz, b) / 2;
    cur.push(`BT /F${b ? 2 : 1} ${sz} Tf ${x.toFixed(2)} ${y.toFixed(2)} Td (${e(t)}) Tj ET`);
  };
  P.ln = (x1, y1, x2, y2, wd, g) => cur.push(`${g} G ${wd} w ${x1} ${y1} m ${x2} ${y2} l S`);
  P.rc = (x, y, w, h, g) => cur.push(`${g} g ${x} ${y} ${w} ${h} re f 0 g`);
  P.out = () => {
    const n = pg.length;
    pg.forEach((c, i) => {
      cur = c;
      P.ln(P.M, 36, P.W - P.M, 36, 0.5, 0.75);
      P.t(P.M, 24, P.foot, 8, 0);
      P.t(P.W - P.M, 24, 'Page ' + (i + 1) + ' of ' + n, 8, 0, 'r');
    });
    const o = [];
    o[1] = '<< /Type /Catalog /Pages 2 0 R >>';
    o[2] = `<< /Type /Pages /Kids [${pg.map((_, i) => 5 + i * 2 + ' 0 R').join(' ')}] /Count ${n} >>`;
    o[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
    o[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
    pg.forEach((c, i) => {
      const st = c.join('\n');
      o[5 + i * 2] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${P.W} ${P.H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6 + i * 2} 0 R >>`;
      o[6 + i * 2] = `<< /Length ${st.length} >>\nstream\n${st}\nendstream`;
    });

    const off = [];
    for (let i = 1; i < o.length; i++) {
      off[i] = out.length;
      out += i + ' 0 obj\n' + o[i] + '\nendobj\n';
    }
    const x = out.length;
    out += 'xref\n0 ' + o.length + '\n0000000000 65535 f \n' + off.slice(1).map(v => String(v).padStart(10, '0') + ' 00000 n \n').join('') + 'trailer\n<< /Size ' + o.length + ' /Root 1 0 R >>\nstartxref\n' + x + '\n%%EOF';
    return new Blob([out], { type: 'application/pdf' });
  };

}
const nm2 = n => fmt(n).replace('₹', ''),
  bs2 = n => bs(n).replace('₹', '');
function pdfLedger(P, b, l, st, from, to) {
  const lrc = l.group == 'Customers',
    X0 = P.M,
    CW = P.W - 2 * P.M,
    wd = 44,
    wl = lrc ? 62 : 0,
    wn = 66,
    wb = 84,
    wp = CW - wd - wl - wn * 2 - wb,
    xp = X0 + wd,
    xl = xp + wp,
    xd = xl + wl + wn,
    xc = xd + wn,
    xb = X0 + CW;
  const SZ = 8.5;
  const head = cont => {
    if (!cont) {
      P.t(X0, P.y - 14, b.name, 15, 1);
      P.t(xb, P.y - 12, 'Generated ' + today(), 8.5, 0, 'r');
      P.t(X0, P.y - 30, 'Ledger statement', 10, 0);
      P.t(X0, P.y - 48, l.name, 13, 1);
      P.t(X0, P.y - 63, l.group + '   |   Period: ' + (from || 'start') + ' to ' + (to || today()), 9, 0);
      P.y -= 78;
    } else {
      P.t(X0, P.y - 10, l.name + ' (continued)', 10, 1);
      P.y -= 22;
    }
    P.rc(X0, P.y - 18, CW, 18, 0.93);
    const ty = P.y - 12.5;
    P.t(X0 + 4, ty, 'Date', 8.5, 1);
    P.t(xp + 4, ty, 'Particulars', 8.5, 1);
    if (lrc) P.t(xl + 4, ty, 'LR no.', 8.5, 1);
    P.t(xd, ty, 'Debit', 8.5, 1, 'r');
    P.t(xc, ty, 'Credit', 8.5, 1, 'r');
    P.t(xb - 4, ty, 'Balance', 8.5, 1, 'r');
    P.y -= 18;
  };
  const row = (d, pt, lr, dr, cr, bal, bold, z) => {
    const lines = pdfWrap(pt, wp - 8, SZ, bold),
      h = lines.length * 10.5 + 6;
    if (P.y - h < 50) {
      P.page();
      head(true);
    }
    if (z) P.rc(X0, P.y - h, CW, h, 0.975);
    const ty = P.y - 10;
    P.t(X0 + 4, ty, sd(d), SZ, bold);
    lines.forEach((t, i) => P.t(xp + 4, ty - i * 10.5, t, SZ, bold));
    if (lrc && lr) P.t(xl + 4, ty, pdfWrap(lr, wl - 8, SZ)[0], SZ, 0);
    if (dr) P.t(xd, ty, dr, SZ, bold, 'r');
    if (cr) P.t(xc, ty, cr, SZ, bold, 'r');
    if (bal) P.t(xb - 4, ty, bal, SZ, bold, 'r');
    P.ln(X0, P.y - h, X0 + CW, P.y - h, 0.4, 0.88);
    P.y -= h;
  };
  if (P.y < P.H - P.M - 1 || true) head(false);
  row('', 'Opening balance', '', '', '', bs2(st.open), 1, 0);
  st.rows.forEach((x, i) => row(x.d, x.p, x.lr, x.dr ? nm2(x.dr) : '', x.cr ? nm2(x.cr) : '', bs2(x.bal), 0, i % 2));
  P.ln(X0, P.y, X0 + CW, P.y, 0.8, 0.3);
  row('', 'Closing balance', '', nm2(st.tdr), nm2(st.tcr), bs2(st.close), 1, 0);
}

function tipShow(x, pin) {
  if (!TIP.el) {
    TIP.el = document.createElement('div');

    TIP.el.setAttribute('role', 'tooltip');
    document.body.appendChild(TIP.el);

  t.style.display = 'block';
  const r = x.getBoundingClientRect(),
    w = Math.min(320, innerWidth - 16);

  t.style.left = left + 'px';
  t.style.top = top + 'px';
  TIP.on = x;
  TIP.pin = !!pin;
}

  if (TIP.el) TIP.el.style.display = 'none';
  TIP.on = null;
  TIP.pin = false;
}

/* Run a change; if it would leave stock or cash below zero (or the change refuses), put everything back. */
const MKS = ['inv', 'pur', 'prod', 'sr', 'prr', 'rej', 'pp', 'tx', 'exp', 'cust', 'sup', 'banks', 'items'];
function negs(b) {
  const n = b.items.filter(i => stock(b, i) < -1e-6).map(i => i.name);
  [cashAcc(b), gpayAcc(b), ...b.banks].forEach(k => {
    if (bal(b, k) < -0.005) n.push(k.name);
  });
  return n;
}
function tryMut(fn, onErr, onOk) {
  const b = B(),
    snap = {},
    co = b.cashOpen,
    before = negs(b);
  MKS.forEach(k => (snap[k] = b[k]));
  let m = fn(b);
  if (!m) {
    const bad = negs(b).filter(n => !before.includes(n));
    if (bad.length)
      m = `This would leave ${bad.join(', ')} below zero. Change or remove the entries that use it first.`;
  }
  if (m) {
    MKS.forEach(k => (b[k] = snap[k]));
    b.cashOpen = co;
    (onErr || note)(m);
    return false;
  }
  if (onOk) onOk();
  mdlClose();
  save();
  R();
  return true;
}

/* ======== Shared data (several people, one set of books) ======== */
/* Every record (an invoice, a payment, a customer...) is its own document in the shared store, so two
   people editing different records never overwrite each other. The in-memory state S stays the single
   source the screens read; save() writes the changes out and snapshots from other people are merged in. */
const SH_ARR = ['items', 'inv', 'banks', 'tx', 'pur', 'prod', 'cust', 'sup', 'exp', 'sr', 'prr', 'rej', 'pp'];
const SH = {
  db: null, // the shared store, or null when this view has none (data then stays on this device)
  ro: false, // true when this person may look but not change
  owner: true,
  known: new Map(), // what the store held when we last read or wrote it (document id -> short hash)
  synced: false, // this device has synced before, so its saved copy can carry changes not yet uploaded
  busy: false,
  again: false,
  timer: 0,
  ready: false,
  dirty: false, // a form on screen has unsaved typing
  hold: uid() + uid(),
  seq: 0,
  catchup: 0,
  missed: false,
  off: false, // signing out: no more sync work, so nothing is written back after the local copy is cleared
  seen: null, // ids this page has held locally: only these may ever be deleted from the store
  quiet: 0 // after our own writes, snapshots are ignored for a moment in case they pre-date them
};
function shLog(m) {
  // short event log kept across reloads, to find out why a save did not stick
  try {
    const a = JSON.parse(localStorage.getItem('booksmith10log') || '[]');

/* ======== Pickers (styled dropdowns and calendar) ======== */
/* Every <select> and date <input> keeps working underneath; on a mouse-driven screen it is paired with a styled
   button that opens a custom list or calendar and writes the choice back with the usual change event. */
const PK = { pop: null, anchor: null, el: null, close: () => {} };
const pkMon = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const pkP = n => String(n).padStart(2, '0');
const pkIso = (y, m, d) => y + '-' + pkP(m + 1) + '-' + pkP(d);
const pkShow = v => {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || '');
  return m ? +m[3] + ' ' + pkMon[+m[2] - 1].slice(0, 3) + ' ' + m[1] : '';
};
function pkLabel(el, b) {
  let t;
  if (el.tagName === 'SELECT') {
    const o = el.options[el.selectedIndex];
    t = o ? o.text : '';
    b.classList.toggle('empty', !el.value);
  } else {
    t = pkShow(el.value);
    b.classList.toggle('empty', !t);
    if (!t) t = 'Select date';
  }
  b.textContent = t;
  b.disabled = el.disabled;
  const lab = el.closest('label'),
    name = lab ? [...lab.childNodes].filter(n => n.nodeType === 3).map(n => n.textContent).join('').trim() : '';
  b.setAttribute('aria-label', (name ? name + ': ' : '') + t);
  el._pk = el.value + '|' + el.options?.length + '|' + el.disabled + '|' + (el.selectedIndex ?? '');
}
function pkClose(focus) {
  if (PK.pop) {
    PK.pop.remove();
    PK.pop = null;
  }
  if (PK.anchor) {
    PK.anchor.setAttribute('aria-expanded', 'false');
    if (focus) PK.anchor.focus();
  }
  PK.anchor = null;
  document.removeEventListener('mousedown', pkOutside, true);
  window.removeEventListener('resize', pkResize);
}
const pkOutside = e => {
  if (PK.pop && !PK.pop.contains(e.target) && !(PK.anchor && PK.anchor.contains(e.target))) pkClose();
};
const pkResize = () => pkClose();
function pkPlace(pop, b) {
  const r = b.getBoundingClientRect(),
    ph = pop.offsetHeight,
    pw = pop.offsetWidth;
  const below = innerHeight - r.bottom,
    up = below < ph + 12 && r.top > below;
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pw - 8)) + 'px';
  pop.style.top = (up ? Math.max(8, r.top - ph - 6) : r.bottom + 6) + 'px';
  pop.style.minWidth = Math.max(r.width, pop.classList.contains('pkcal') ? 280 : 0) + 'px';
}
function pkOpen(el, b) {
  const same = PK.anchor === b;
  pkClose();
  if (same) return;
  const pop = document.createElement('div');
  pop.className = 'pkpop ' + (el.tagName === 'SELECT' ? 'pklist' : 'pkcal');
  document.body.appendChild(pop);
  PK.pop = pop;
  PK.anchor = b;
  PK.el = el;
  b.setAttribute('aria-expanded', 'true');
  if (el.tagName === 'SELECT') pkList(el, b, pop);
  else pkCal(el, b, pop);
  pkPlace(pop, b);
  document.addEventListener('mousedown', pkOutside, true);
  window.addEventListener('resize', pkResize);
}
function pkSet(el, v) {
  if (el.tagName === 'SELECT') el.selectedIndex = v;
  else el.value = v;
  el.dispatchEvent(new Event('input', { bubbles: true }));
  el.dispatchEvent(new Event('change', { bubbles: true }));
  const b = el.nextElementSibling;
  if (b && b.classList.contains('pkb')) pkLabel(el, b);
}
function pkList(el, b, pop) {
  const opts = [...el.options],
    many = opts.length > 9;
  let act = Math.max(0, el.selectedIndex),
    q = '';
  pop.setAttribute('role', 'listbox');
  pop.innerHTML = (many ? '<input class="pks" placeholder="Search" aria-label="Search options">' : '') + '<div class="pkl"></div>';
  const box = pop.querySelector('.pkl'),
    vis = () => opts.map((o, i) => i).filter(i => !q || opts[i].text.toLowerCase().includes(q));
  const draw = () => {
    box.innerHTML =
      vis()
        .map(
          i =>
            `<div role="option" class="pko${i === el.selectedIndex ? ' sel' : ''}${i === act ? ' act' : ''}${opts[i].disabled ? ' dis' : ''}" data-i="${i}" aria-selected="${i === el.selectedIndex}">${esc(opts[i].text) || '&nbsp;'}</div>`
        )
        .join('') || '<div class="pkn">No match</div>';
    const a = box.querySelector('.act');
    if (a) a.scrollIntoView({ block: 'nearest' });
  };
  draw();
  const pick = i => {
    if (opts[i] && !opts[i].disabled) {
      pkSet(el, i);
      pkClose(true);
    }
  };
  box.onmousedown = e => e.preventDefault();
  box.onclick = e => {
    const o = e.target.closest('.pko');
    if (o) pick(+o.dataset.i);
  };
  box.onmousemove = e => {
    const o = e.target.closest('.pko');
    if (o && +o.dataset.i !== act) {
      box.querySelector('.act')?.classList.remove('act');
      act = +o.dataset.i;
      o.classList.add('act');
    }
  };
  const key = e => {
    const v = vis(),
      at = v.indexOf(act);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      act = v[Math.max(0, Math.min(v.length - 1, at + (e.key === 'ArrowDown' ? 1 : -1)))] ?? act;
      draw();
    } else if (e.key === 'Home' || e.key === 'End') {
      e.preventDefault();
      act = v[e.key === 'Home' ? 0 : v.length - 1] ?? act;
      draw();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      pick(act);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      pkClose(true);
    } else if (e.key === 'Tab') pkClose();
    else if (!many && e.key.length === 1) {
      const n = v.find(i => opts[i].text.toLowerCase().startsWith(e.key.toLowerCase()) && i > act) ?? v.find(i => opts[i].text.toLowerCase().startsWith(e.key.toLowerCase()));
      if (n != null) {
        act = n;
        draw();
      }
    }
  };
  const s = pop.querySelector('.pks');
  if (s) {
    s.oninput = () => {
      q = s.value.toLowerCase();
      act = vis()[0] ?? act;
      draw();
    };
    s.onkeydown = key;
    s.focus();
  } else {
    pop.tabIndex = -1;
    pop.onkeydown = key;
    pop.focus();
  }
}
function pkCal(el, b, pop) {
  const now = new Date(),
    td = pkIso(now.getFullYear(), now.getMonth(), now.getDate());
  let cur = /^\d{4}-\d{2}-\d{2}$/.test(el.value) ? el.value : td,
    y = +cur.slice(0, 4),
    m = +cur.slice(5, 7) - 1,
    foc = cur;
  const draw = () => {
    const first = new Date(y, m, 1),
      lead = (first.getDay() + 6) % 7, // weeks start on Monday
      cells = [];
    for (let i = 0; i < 42; i++) {
      const d = new Date(y, m, 1 - lead + i);
      cells.push({ iso: pkIso(d.getFullYear(), d.getMonth(), d.getDate()), d: d.getDate(), out: d.getMonth() !== m });
    }
    pop.setAttribute('role', 'dialog');
    pop.setAttribute('aria-label', 'Choose date');
    pop.innerHTML = `<div class="pkh"><button type="button" class="pkn1" data-a="py" aria-label="Previous year">«</button><button type="button" class="pkn1" data-a="pm" aria-label="Previous month">‹</button><div class="pkt" aria-live="polite">${pkMon[m]} ${y}</div><button type="button" class="pkn1" data-a="nm" aria-label="Next month">›</button><button type="button" class="pkn1" data-a="ny" aria-label="Next year">»</button></div>
    <div class="pkg" role="grid">${['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(x => `<span class="pkw">${x}</span>`).join('')}${cells
      .map(c => `<button type="button" class="pkd${c.out ? ' out' : ''}${c.iso === td ? ' today' : ''}${c.iso === el.value ? ' sel' : ''}" data-d="${c.iso}" tabindex="${c.iso === foc ? 0 : -1}" aria-label="${pkShow(c.iso)}"${c.iso === el.value ? ' aria-pressed="true"' : ''}>${c.d}</button>`)
      .join('')}</div>
    <div class="pkf"><button type="button" class="pkx" data-a="today">Today</button><button type="button" class="pkx" data-a="clear">Clear</button></div>`;
    pkPlace(pop, b);
  };
  const move = (iso, days) => {
    const d = new Date(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10) + days);
    foc = pkIso(d.getFullYear(), d.getMonth(), d.getDate());
    y = d.getFullYear();
    m = d.getMonth();
    draw();
    pop.querySelector('.pkd[tabindex="0"]')?.focus();
  };
  pop.onmousedown = e => {
    if (!e.target.closest('input')) e.preventDefault();
  };
  pop.onclick = e => {
    const x = e.target.closest('button');
    if (!x) return;
    const a = x.dataset.a;
    if (x.dataset.d) {
      pkSet(el, x.dataset.d);
      pkClose(true);
    } else if (a === 'today') {
      pkSet(el, td);
      pkClose(true);
    } else if (a === 'clear') {
      pkSet(el, '');
      pkClose(true);
    } else {
      const dm = { py: [-12], pm: [-1], nm: [1], ny: [12] }[a][0],
        d = new Date(y, m + dm, 1);
      y = d.getFullYear();
      m = d.getMonth();
      foc = pkIso(y, m, 1);
      draw();
    }
  };
  pop.onkeydown = e => {
    const t = e.target.closest('.pkd');
    const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
    if (t && step) {
      e.preventDefault();
      move(t.dataset.d, step);
    } else if (t && (e.key === 'PageDown' || e.key === 'PageUp')) {
      e.preventDefault();
      const d = new Date(+t.dataset.d.slice(0, 4), +t.dataset.d.slice(5, 7) - 1 + (e.key === 'PageDown' ? 1 : -1), +t.dataset.d.slice(8, 10));
      move(pkIso(d.getFullYear(), d.getMonth(), d.getDate()), 0);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      pkClose(true);
    } else if (e.key === 'Tab') {
      const f = [...pop.querySelectorAll('button:not([tabindex="-1"])')];
      if (f.length) {
        const i = f.indexOf(document.activeElement);
        if (e.shiftKey && i <= 0) {
          e.preventDefault();
          f[f.length - 1].focus();
        } else if (!e.shiftKey && i === f.length - 1) {
          e.preventDefault();
          f[0].focus();
        }
      }
    }
  };
  draw();
  pop.querySelector('.pkd[tabindex="0"]')?.focus();
}
function pkCombo(inp) {
  // customer / supplier search: a styled suggestion list instead of the browser's own
  inp.dataset.pkc = '1';
  const id = inp.getAttribute('list');
  inp.removeAttribute('list');
  inp.setAttribute('autocomplete', 'off');
  inp.setAttribute('role', 'combobox');
  inp.setAttribute('aria-expanded', 'false');
  let pop = null,
    act = -1,
    items = [];
  const names = () => [...(document.getElementById(id)?.options || [])].map(o => o.value);
  const close = () => {
    if (pop) pop.remove();
    pop = null;
    act = -1;
    inp.setAttribute('aria-expanded', 'false');
    window.removeEventListener('resize', close);
  };
  const choose = n => {
    if (n == null) return;
    inp.value = n;
    inp.dispatchEvent(new Event('input', { bubbles: true }));
    inp.dispatchEvent(new Event('change', { bubbles: true }));
    close();
  };
  const draw = () => {
    const all = names(),
      q = all.includes(inp.value) ? '' : inp.value.trim().toLowerCase(); // a finished choice shows the whole list
    items = all.filter(n => !q || n.toLowerCase().includes(q)).slice(0, 50);
    if (!pop) {
      pop = document.createElement('div');
      pop.className = 'pkpop pklist';
      pop.setAttribute('role', 'listbox');
      pop._inp = inp;
      pop.onmousedown = e => e.preventDefault();
      pop.onclick = e => {
        const o = e.target.closest('.pko');
        if (o) choose(items[+o.dataset.i]);
      };
      document.body.appendChild(pop);
      window.addEventListener('resize', close);
    }
    pop.innerHTML =
      '<div class="pkl">' +
      (items.length
        ? items.map((n, i) => `<div role="option" class="pko${i === act ? ' act' : ''}${n === inp.value ? ' sel' : ''}" data-i="${i}">${esc(n)}</div>`).join('')
        : `<div class="pkn">${all.length ? 'No match.' : 'None yet.'} Add new ones in Customers &amp; suppliers.</div>`) +
      '</div>';
    inp.setAttribute('aria-expanded', 'true');
    pkPlace(pop, inp);
    const a = pop.querySelector('.act');
    if (a) a.scrollIntoView({ block: 'nearest' });
  };
  inp.addEventListener('focus', draw);
  inp.addEventListener('click', () => {
    if (!pop) draw();
  });
  inp.addEventListener('input', () => {
    act = -1;
    draw();
  });
  inp.addEventListener('blur', close);
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!pop) draw();
      act = Math.max(0, Math.min(items.length - 1, act + (e.key === 'ArrowDown' ? 1 : -1)));
      draw();
    } else if (e.key === 'Enter' && pop && act >= 0) {
      e.preventDefault();
      choose(items[act]);
    } else if (e.key === 'Escape' && pop) {
      e.preventDefault();
      close();
    } else if (e.key === 'Tab') close();
  });
}
function pkEnhance() {
  if (matchMedia('(pointer:coarse)').matches) return; // touch screens keep their own pickers
  document.querySelectorAll('select:not([data-pk]):not([multiple]),input[type=date]:not([data-pk])').forEach(el => {
    el.dataset.pk = '1';
    const w = document.createElement('span');
    w.className = 'pk';
    el.parentNode.insertBefore(w, el);
    w.appendChild(el);
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pkb ' + (el.tagName === 'SELECT' ? 'sel' : 'dat');
    b.setAttribute('aria-haspopup', el.tagName === 'SELECT' ? 'listbox' : 'dialog');
    b.setAttribute('aria-expanded', 'false');
    w.appendChild(b);
    el.tabIndex = -1;
    el.setAttribute('aria-hidden', 'true');
    b.onclick = () => pkOpen(el, b);
    b.onkeydown = e => {
      if (el.tagName === 'SELECT' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
        e.preventDefault();
        pkOpen(el, b);
      }
    };
    pkLabel(el, b);
  });
  document.querySelectorAll('input[list]:not([data-pkc])').forEach(pkCombo);
  document.querySelectorAll('.pkpop').forEach(p => {
    if (p._inp && !document.body.contains(p._inp)) p.remove();
  });
  document.querySelectorAll('[data-pk]').forEach(el => {
    const b = el.nextElementSibling;
    if (b && b.classList.contains('pkb') && el._pk !== el.value + '|' + el.options?.length + '|' + el.disabled + '|' + (el.selectedIndex ?? '')) pkLabel(el, b);
  });

}
new MutationObserver(() => requestAnimationFrame(pkEnhance)).observe(document.body, { childList: true, subtree: true });
setInterval(pkEnhance, 400); // keeps the label in step when code changes a value
